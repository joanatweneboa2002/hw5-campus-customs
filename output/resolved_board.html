<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Customs: Resolved Board</title>
  <style>
    body {
      margin: 0;
      padding: 32px 24px 64px;
      background: #ffffff;
      color: #222222;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    main { max-width: 1100px; margin: 0 auto; }
    h1 { margin: 0 0 4px; font-size: 28px; }
    .sub { margin: 0 0 32px; color: #666666; }
    section { margin-bottom: 48px; }
    h2 {
      margin: 0 0 12px;
      padding-left: 12px;
      border-left: 4px solid #d6336c;
      font-size: 22px;
    }
    h2 span { color: #666666; font-weight: normal; }
    img {
      display: block;
      width: 100%;
      height: auto;
      border: 1px solid #dddddd;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <h1>Campus Customs: Resolved Board</h1>
    <p class="sub">Agent Desk screenshots, one per ticket, after the agents resolved each one.</p>

    <section>
      <h2>Ticket 101 <span>· Bulldog tee</span></h2>
      <img src="screenshots/ticket_101.png" alt="Agent Desk board showing Ticket 101, Bulldog tee, resolved">
    </section>

    <section>
      <h2>Ticket 102 <span>· Rent due</span></h2>
      <img src="screenshots/ticket_102.png" alt="Agent Desk board showing Ticket 102, Rent due, resolved">
    </section>

    <section>
      <h2>Ticket 103 <span>· Bulk hoodie discount</span></h2>
      <img src="screenshots/ticket_103.png" alt="Agent Desk board showing Ticket 103, Bulk hoodie discount, resolved">
    </section>
  </main>
</body>
</html>
